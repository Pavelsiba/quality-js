name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        env:
          LEFTHOOK: "0"
      - run: npm run lint
      - run: npm run lint:md
      - run: npm test

  # Релиз — после зелёных проверок на main: semantic-release по conventional commits ставит версию в
  # package.json, пишет CHANGELOG.md, тег vX.Y.Z и публикует пакет на npmjs.org.
  # Руками version и теги не трогать: мажорная версия — только от feat! / BREAKING CHANGE.
  release:
    name: Release
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # Trusted Publishing: npm меняет OIDC-токен прогона на разовый токен публикации — секрета
      # NPM_TOKEN нет. Доверенный издатель задан на npmjs.com: Pavelsiba / quality-js / ci.yml.
      id-token: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        env:
          LEFTHOOK: "0"

      # LEFTHOOK=0: релизный коммит «chore(release): X.Y.Z» не по-русски, commitlint его бы отверг.
      - name: Release
        env:
          LEFTHOOK: "0"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Репозиторий приватный, а provenance npm для приватных не выпускает: без этого
          # Trusted Publishing включил бы его сам, и публикация бы упала (предположение).
          NPM_CONFIG_PROVENANCE: "false"
        run: npx semantic-release
