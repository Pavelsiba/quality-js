name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        env:
          LEFTHOOK: "0"
      - run: npm run lint
      - run: npm run lint:md
      - run: npm test

  # Публикация — по тегу vX.Y.Z, после зелёных проверок. Версия тега обязана совпасть с
  # package.json: иначе в реестр уедет не та версия, которую обещает тег.
  publish:
    name: Publish
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@pavelsiba"

      - name: Версия тега = версия пакета
        env:
          TAG: ${{ github.ref_name }}
        run: test "${TAG#v}" = "$(node -p 'require("./package.json").version')"

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
