version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    ignore:
      # v10 требует conventional-changelog-writer@9, а release-notes-generator тянет @8
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: ["version-update:semver-major"]
      # typescript-eslint принимает typescript <6.1.0: 7.x ломает установку
      - dependency-name: typescript
        versions: [">=7"]
