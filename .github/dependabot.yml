version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    ignore:
      # v10 требует conventional-changelog-writer@9, а release-notes-generator тянет @8
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: ["version-update:semver-major"]
      # @feature-sliced/filesystem (через steiger) требует typescript ^5.8.3, а typescript-eslint — <6.1.0:
      # 6.x даёт битый lock-файл (npm ci), 7.x — ERESOLVE
      - dependency-name: typescript
        versions: [">=6"]
